name: Update Projects Data & Concept Renders

on:
  push:
    paths:
      - 'data/projects.xlsx'
      - 'projects/data/projects.xlsx'
      - 'scripts/build_projects.py'
      - 'scripts/image_style.txt'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      direct_commit:
        description: 'Doğrudan main dalına commit at (PR açmak yerine)?'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry-run modu (Değişiklik yapmadan simüle et)?'
        required: false
        default: false
        type: boolean

# En az yetki prensibi (Least Privilege)
permissions:
  contents: write
  pull-requests: write

# İsteğe göre doğrudan commit atma varsayılanı (PR için 'false', doğrudan main için 'true')
env:
  DIRECT_COMMIT: 'false'

jobs:
  build-and-sync:
    name: Build Projects from Excel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Build Projects Pipeline
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          NVIDIA_IMAGE_MODEL: ${{ vars.NVIDIA_IMAGE_MODEL }}
          GOOGLE_SHEET_ID: '1r9aVO0WNHy4AtvIQu1rExEB9X1of1KBOU5ErUTf0jFw'
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python scripts/build_projects.py $DRY_RUN_FLAG

      - name: Check for file modifications
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Değişiklikler tespit edildi."
            git status --short
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Herhangi bir değişiklik bulunmadı."
          fi

      - name: Commit and push directly to main
        if: steps.git_status.outputs.has_changes == 'true' && (env.DIRECT_COMMIT == 'true' || github.event.inputs.direct_commit == true)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ projects/data/ assets/ projects/assets/
          git commit -m "chore(data): auto-update projects & concept renders from Excel [skip ci]"
          git push origin main

      - name: Create Pull Request for Review
        if: steps.git_status.outputs.has_changes == 'true' && env.DIRECT_COMMIT != 'true' && github.event.inputs.direct_commit != true
        uses: peter-evans/create-pull-request@v6.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(data): auto-update projects and assets from Excel"
          branch: "automation/projects-sync"
          delete-branch: true
          title: "🤖 Otomatik Veri Güncellemesi (Excel -> projects.json)"
          body-path: "data/pr_summary.md"
          labels: |
            automated-pr
            projects-data
